name: Spiel auf GitHub Pages veröffentlichen

on:
  push:
    branches: [claude/fadenfreunde, main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Level-Tests
        run: node tests/levels.test.js
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site
          cp -r index.html style.css manifest.webmanifest src vendor icons assets _site/
          node tools/build.js _site/fadenfreunde.html
          # Versionsstempel: Dateien bekommen ?v=<commit>, damit Browser nie alte Stände aus dem Cache nehmen.
          V="${GITHUB_SHA::8}-${GITHUB_RUN_NUMBER}"
          echo "{\"v\":\"$V\"}" > _site/version.json
          sed -i -E "s#(src=\"(src|vendor)/[a-z0-9.]+\.js)\"#\1?v=$V\"#g; s#href=\"style.css\"#href=\"style.css?v=$V\"#; s#<script src=\"src/core.js#<script>window.FF_VERSION='$V'</script>\n<script src=\"src/core.js#" _site/index.html
          sed -i "s#<head>#<head>\n<meta http-equiv=\"Cache-Control\" content=\"no-cache\">#" _site/index.html _site/fadenfreunde.html
          grep -c "?v=$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
